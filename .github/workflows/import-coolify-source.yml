name: Import Coolify security-filtered source snapshot

# One-time push trigger plus manual rerun. Standard runners are free for public repositories.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-coolify-source.yml']

permissions:
  contents: write

concurrency:
  group: coolify-source-import
  cancel-in-progress: false

jobs:
  import-current-upstream-source:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check source branch does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/coolify-upstream-snapshot >/dev/null 2>&1; then
            echo "::error::Snapshot branch exists. This import will not overwrite it."
            exit 1
          fi

      - name: Download complete tracked files from Coolify main (not full history)
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone \
            --depth=1 --single-branch --branch main --filter=blob:none \
            https://github.com/coollabsio/coolify.git upstream
          cd upstream
          git fetch --depth=1 origin 93c7e53e9f07bfdb1c776899cb2e559e5a49aa34
          git checkout --detach 93c7e53e9f07bfdb1c776899cb2e559e5a49aa34
          test "$(git rev-parse HEAD)" = "93c7e53e9f07bfdb1c776899cb2e559e5a49aa34"
          git rev-parse HEAD > ../UPSTREAM_COMMIT
          git rev-parse 'HEAD^{tree}' > ../UPSTREAM_TREE
          git ls-tree -r --name-only HEAD | wc -l | tee ../UPSTREAM_TRACKED_FILE_COUNT
          if [ -f .gitmodules ]; then
            echo "::warning::Upstream contains submodules: their content is not included in the Git superproject snapshot."
            cat .gitmodules
          fi
          if [ -f .gitattributes ] && grep -Eq 'filter=lfs' .gitattributes; then
            echo "::warning::Upstream declares Git LFS paths; verify that binary LFS objects are available separately."
          fi

      - name: Prepare complete upstream source under isolated upstream/ directory
        run: |
          set -euo pipefail
          cd upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UPSTREAM_TREE="$(cat ../UPSTREAM_TREE)"
          git checkout --orphan coolify-upstream-snapshot
          git read-tree --empty
          git read-tree --prefix=upstream/ "$UPSTREAM_TREE"
          # GitHub push protection flagged upstream embedded SSH private keys
          # in these test fixtures / seeders. Never bypass protection or copy them.
          for file in \
            database/seeders/PrivateKeySeeder.php \
            tests/Feature/Api/CloudInitPublicBackupDeployAbilityTest.php \
            tests/Feature/ApplicationHttpBasicAuthUiTest.php \
            tests/Feature/Livewire/RailpackLivewireUiTest.php \
            tests/Feature/TerminalAuthRoutesAuthorizationTest.php; do
            git update-index --force-remove -- "upstream/$file"
          done
          # Additional SSH-key-bearing fixture paths flagged by GitHub.
          for file in \
            database/factories/PrivateKeyFactory.php \
            tests/Feature/ApplicationSourceLocalhostKeyTest.php \
            tests/Feature/ServerSettingsAuditTest.php \
            tests/Feature/VultrServerLifecycleTest.php \
            tests/Unit/VultrDeleteServerTest.php; do
            git update-index --force-remove -- "upstream/$file"
          done
          # Also exclude other files with PEM private-key headers.
          git grep -l -I \
            -e 'BEGIN OPENSSH PRIVATE KEY' \
            -e 'BEGIN RSA PRIVATE KEY' \
            -e 'BEGIN EC PRIVATE KEY' \
            -e 'BEGIN DSA PRIVATE KEY' \
            -e 'BEGIN PRIVATE KEY' \
            93c7e53e9f07bfdb1c776899cb2e559e5a49aa34 -- 2>/dev/null \
            | sed 's/^[^:]*://' > ../PRIVATE_KEY_PATHS || true
          while IFS= read -r file; do
            [ -n "$file" ] && git update-index --force-remove -- "upstream/$file"
          done < ../PRIVATE_KEY_PATHS
          IMPORT_TREE="$(git write-tree)"
          SUBTREE="$(git rev-parse "$IMPORT_TREE:upstream")"
          test "$SUBTREE" != "$UPSTREAM_TREE"
          printf '%s\n' "$SUBTREE" > ../FILTERED_TREE
          # Upstream is nested under upstream/; original file paths, including
          # upstream/.github/workflows, are data and are preserved unchanged.
          # Commit only the exact preverified index tree. The shallow checkout's
          # original working directory remains present, but MUST NOT be staged.
          test "$(git ls-tree --name-only "$(git write-tree)")" = "upstream"
          git -c core.hooksPath=/dev/null commit -m "Reference source snapshot of coollabsio/coolify at $(cat ../UPSTREAM_COMMIT)"
          git fsck --no-reflogs --connectivity-only

      - name: Push snapshot branch to research repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git remote add research "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null push research HEAD:refs/heads/coolify-upstream-snapshot

      - name: Verify uploaded snapshot against upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream
          git fetch research coolify-upstream-snapshot --depth=1
          LOCAL_TREE="$(git rev-parse 'HEAD:upstream')"
          REMOTE_TREE="$(git rev-parse 'FETCH_HEAD:upstream')"
          test "${LOCAL_TREE}" = "${REMOTE_TREE}"
          test "${REMOTE_TREE}" = "$(cat ../FILTERED_TREE)"
          test "$(cat ../UPSTREAM_TREE)" = "446804215dd79e0489396ee167bf60f185a0c8db"
          echo "Verified matching Git tree: ${REMOTE_TREE}"
          echo "Upstream source commit: $(cat ../UPSTREAM_COMMIT)"
          echo "Upstream tracked-file count: $(cat ../UPSTREAM_TRACKED_FILE_COUNT)"
          echo "Retained tracked-file count: $(git ls-tree -r --name-only FETCH_HEAD:upstream | wc -l)"
          echo "Known SSH-key-bearing fixtures and any further PEM-bearing files excluded"
          echo "Imported branch: coolify-upstream-snapshot"
