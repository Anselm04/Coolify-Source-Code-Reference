name: One-time pinned coolify source identity audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/coollabsio/coolify.git
      upstream_sha: 93c7e53e9f07bfdb1c776899cb2e559e5a49aa34
      audit_slug: coolify
